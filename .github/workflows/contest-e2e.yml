name: Contest test round
# Plays one full photo-contest round (register → photos → voting → jury → winners) in a real browser,
# against throwaway local Firebase emulators. Never touches the live database, Drive, email or push.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save --no-audit --no-fund firebase-tools@14 firebase-admin@13 playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/e2e/patch.mjs
      - name: Run the round
        run: |
          set -o pipefail
          mkdir -p e2e-out
          (cd public && python3 -m http.server 5055 >/dev/null 2>&1 &)
          npx firebase emulators:exec --only auth,firestore --project demo-rcmi \
            "node tools/e2e/seed.mjs && node tools/e2e/run.mjs && node tools/e2e/check.mjs" 2>&1 | tee e2e-out/console.txt
      - if: always()
        run: |
          { echo "## Contest test round"; echo '```'; cat e2e-out/steps.txt e2e-out/report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save results to the tool-e2e branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r e2e-out/. /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b tool-e2e && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Contest test round results" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tool-e2e
