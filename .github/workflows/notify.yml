name: Email notifications & phone sync

# Every 30 minutes, as a backup (the Firebase function sends notifications instantly; it shares a lock with this job, so nothing is sent twice):
#  1. Emails the admins about new sign-ups, joining-fee proofs, Contact messages, delete requests and reports,
#     and emails every user about their own comments, replies, messages, likes, sales and admin notices.
#  2. Writes members' changed phone numbers back to the "RCMI Member List" Google Sheet.
#
# Repo secrets:
#   FIREBASE_SERVICE_ACCOUNT  - already set (used for deploys)
#   GMAIL_USER, GMAIL_APP_PASSWORD, NOTIFY_TO (optional) - for the emails
# Phone sync: share the member sheet with the service account's email as Editor.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test email to the admins"
        type: boolean
        default: false

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: scripts
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          npm install --no-audit --no-fund --silent
      - name: Send a test email
        if: ${{ inputs.test }}
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: SA_JSON_PATH="$RUNNER_TEMP/sa.json" node notify-test.mjs
      - name: Sync changed phone numbers to the Google Sheet
        if: always()
        working-directory: scripts
        run: SA_JSON_PATH="$RUNNER_TEMP/sa.json" node phone-sync.mjs
      - name: Emails & phone notifications (backup; the Firebase function normally sends them instantly)
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          (cd functions && npm install --no-audit --no-fund --silent)
          SA_JSON_PATH="$RUNNER_TEMP/sa.json" node functions/cli.js
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
