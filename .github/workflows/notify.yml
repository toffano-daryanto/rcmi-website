name: Email notifications & phone sync

# Every 10 minutes (free on GitHub Actions):
#  1. Emails the admin about new sign-ups, joining-fee proofs and Contact messages.
#  2. Writes members' changed phone numbers back to the "RCMI Member List" Google Sheet.
#
# Repo secrets:
#   FIREBASE_SERVICE_ACCOUNT  - already set (used for deploys)
#   GMAIL_USER, GMAIL_APP_PASSWORD, NOTIFY_TO (optional) - for the emails
# Phone sync: share the member sheet with the service account's email as Editor.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: scripts
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          npm install --no-audit --no-fund --silent
      - name: Sync changed phone numbers to the Google Sheet
        working-directory: scripts
        run: SA_JSON_PATH="$RUNNER_TEMP/sa.json" node phone-sync.mjs
      - name: Email the admin about new activity
        if: always()
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: SA_JSON_PATH="$RUNNER_TEMP/sa.json" node notify.mjs
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
