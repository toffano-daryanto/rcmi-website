name: Render contest posters
# Turns tools/posters/*.html into public/img/contest/poster-*.jpg (with the real Google Fonts), commits them, then deploys.
on:
  workflow_dispatch:
  push:
    paths: ["tools/posters/**"]
permissions:
  contents: write
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tools/posters/render.mjs && sh tools/bump-version.sh
      - name: Commit images
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add public/img/contest/poster-*.jpg public/js public/index.html
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Contest posters (rendered)"
          git push
          gh workflow run deploy.yml --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
