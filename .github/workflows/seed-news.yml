name: Add news items
# Downloads the news photos into the site, then adds/updates tools/news-seed.json on the News page.
on:
  workflow_dispatch:
  push:
    paths: ["tools/news-seed.json"]
permissions:
  contents: write
  actions: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Download news photos into the site
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          pip install --quiet pillow
          python3 tools/news-images.py
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add public/img/news
          if ! git diff --cached --quiet; then git commit -qm "News photos"; git push; gh workflow run deploy.yml --ref main; fi
      - working-directory: scripts
        env: { SA_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          npm install --no-audit --no-fund --silent
          SA_JSON_PATH="$RUNNER_TEMP/sa.json" node seed-news.mjs
          rm -f "$RUNNER_TEMP/sa.json"
