name: Test database rules

# Runs the security-rule checks in tests/ against the Firestore emulator.
# On every push that changes the rules or the tests, and by hand from the Actions tab.
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/test-rules.yml"]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: tests
        run: npm install --no-audit --no-fund --silent
      - name: Run rule checks in the Firestore emulator
        run: tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-rcmi "node --test --test-concurrency=1 tests/rules.test.mjs"
