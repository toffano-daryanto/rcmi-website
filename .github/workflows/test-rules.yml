name: Test database rules

# Runs the security-rule checks in tests/ against the Firestore emulator.
# On every push that changes the rules or the tests, and by hand from the Actions tab.
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/test-rules.yml"]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: tests
        run: npm install --no-audit --no-fund --silent
      - name: Run rule checks in the Firestore emulator
        run: |
          set +e
          tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-rcmi \
            "node --test --test-concurrency=1 --test-reporter=spec tests/rules.test.mjs" > rules-test.log 2>&1
          code=$?
          cat rules-test.log
          # Show each failing check as an annotation (visible on the run page).
          grep -E '^\s*✖' rules-test.log | sed 's/^\s*//' | head -20 | while read -r line; do echo "::error::$line"; done
          grep -E 'FirebaseError|PERMISSION_DENIED|Error:' rules-test.log | sort | uniq -c | head -8 | while read -r line; do echo "::warning::$line"; done
          { echo '## Database rule checks'; echo '```'; grep -E '✔|✖|^ℹ' rules-test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Save the log to the tool-rulestest branch
        if: always()
        run: |
          mkdir -p rlog && cp rules-test.log rlog/ 2>/dev/null || true
          cd rlog && git init -q -b tool-rulestest && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Rules test log" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tool-rulestest
