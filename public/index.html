<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCMI — Resin Car Model Indonesia</title>
  <meta name="description" content="Komunitas kolektor dan pembuat model mobil resin skala 1:64 di Indonesia.">
  <meta name="theme-color" content="#12141C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=1792599814">
  <link rel="icon" type="image/png" href="/img/icon-64.png">
  <link rel="apple-touch-icon" href="/img/icon-192.png">
  <meta property="og:image" content="/img/icon-512.png">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="wordmark" href="#/" aria-label="RCMI — Resin Car Model Indonesia, beranda">
      <img class="logo" src="/img/logo-white.png" alt="RCMI — Resin Car Model Indonesia" width="900" height="343">
    </a>
    <nav class="topnav" id="landing-nav">
      <a href="#about" data-i18n="nav_about">Tentang</a>
      <a href="#gallery" data-i18n="nav_gallery">Galeri</a>
      <a href="#market" data-i18n="nav_market">Pasar</a>
      <a href="#join" data-i18n="nav_join">Cara bergabung</a>
    </nav>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="id" aria-pressed="true">ID</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="btn btn-amber" id="btn-signin" data-i18n="sign_in">Masuk dengan Google</button>
      <a class="btn btn-amber" id="btn-area" href="#/collection" hidden data-i18n="member_area">Area Anggota</a>
      <a class="btn btn-ghost-light" id="btn-home" href="#/" hidden data-i18n="home">Beranda</a>
      <div class="user-chip" id="user-chip" hidden>
        <img id="user-avatar" alt="" width="32" height="32" referrerpolicy="no-referrer">
        <button type="button" class="btn-link" id="btn-signout" data-i18n="sign_out">Keluar</button>
      </div>
    </div>
  </header>

  <div class="banner" id="setup-banner" role="alert" hidden data-i18n="setup_missing"></div>

  <main id="main">

    <!-- ===== Public landing ===== -->
    <section id="landing">
      <div class="hero">
        <div class="hero-inner">
          <h1 data-i18n="hero_title">Mobil resin 1:64, dicetak tangan, dikoleksi bersama.</h1>
          <p class="lead"><span data-i18n="hero_lead"></span> <span id="lead-users"></span></p>
          <div class="hero-cta">
            <p class="stats" id="stats" hidden></p>
            <button type="button" class="btn btn-amber btn-lg js-signin" data-i18n="sign_in">Masuk dengan Google</button>
          </div>
        </div>

        <figure class="scale-tool" aria-labelledby="ruler-out">
          <label for="real-length" class="scale-label" data-i18n="ruler_label">Panjang mobil asli (meter)</label>
          <div class="scale-input">
            <input type="range" id="real-length" min="3" max="6.4" step="0.05" value="4.5">
            <output id="real-length-out">4.50 m</output>
          </div>
          <div class="ruler" aria-hidden="true">
            <div class="ruler-bar" id="ruler-bar"></div>
            <div class="ruler-ticks"></div>
            <div class="ruler-nums"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100 mm</span></div>
          </div>
          <figcaption>
            <strong id="ruler-out"></strong>
            <span data-i18n="ruler_hint"></span>
          </figcaption>
        </figure>
      </div>

      <div class="pitlane" id="pitlane" hidden>
        <div class="pitlane-track" id="pitlane-track"></div>
      </div>

      <section class="about" id="about">
        <h2 data-i18n="about_title">Apa itu RCMI</h2>
        <div class="about-grid">
          <div><h3 data-i18n="about_1_t"></h3><p data-i18n="about_1_d"></p></div>
          <div><h3 data-i18n="about_2_t"></h3><p data-i18n="about_2_d"></p></div>
          <div><h3 data-i18n="about_3_t"></h3><p data-i18n="about_3_d"></p></div>
        </div>
      </section>

      <section class="gallery" id="gallery">
        <h2 data-i18n="gallery_title">Galeri</h2>
        <p class="muted" data-i18n="gallery_lead"></p>
        <div id="gallery-groups"></div>
      </section>

      <section class="market" id="market">
        <h2 data-i18n="market_title">Pasar RCMI</h2>
        <p class="muted" data-i18n="market_lead"></p>
        <div class="view-head">
          <div class="seg" role="group">
            <button type="button" data-mfilter="all" aria-pressed="true" data-i18n="all"></button>
            <button type="button" data-mfilter="sell" aria-pressed="false" data-i18n="t_sell"></button>
            <button type="button" data-mfilter="trade" aria-pressed="false" data-i18n="t_trade"></button>
            <button type="button" data-mfilter="wanted" aria-pressed="false" data-i18n="t_wanted"></button>
          </div>
          <button type="button" class="btn btn-mat" id="btn-add-listing" data-i18n="add_listing" hidden></button>
          <p class="market-hint muted" id="market-hint" data-i18n="market_hint"></p>
        </div>
        <div class="grid" id="listings"></div>
      </section>

      <section class="join" id="join">
        <h2 data-i18n="join_title">Cara bergabung</h2>
        <div class="fees">
          <div class="fee">
            <h3 data-i18n="fee_title"></h3>
            <p class="fee-amt" data-i18n="fee_join_amt"></p>
            <p data-i18n="fee_join"></p>
            <p class="fee-amt" data-i18n="fee_month_amt"></p>
            <p data-i18n="fee_month"></p>
          </div>
          <div class="fee">
            <h3 data-i18n="benefits_title"></h3>
            <ul class="benefits">
              <li data-i18n="benefit_1"></li>
              <li data-i18n="benefit_2"></li>
              <li data-i18n="benefit_3"></li>
            </ul>
          </div>
        </div>
        <ol class="steps">
          <li data-i18n="join_1"></li>
          <li data-i18n="join_2"></li>
          <li data-i18n="join_3"></li>
          <li data-i18n="join_4"></li>
        </ol>
        <button type="button" class="btn btn-mat js-signin" data-i18n="sign_in">Masuk dengan Google</button>
      </section>
    </section>

    <!-- ===== Onboarding / pending / rejected ===== -->
    <section id="gate" hidden>
      <div class="panel" id="gate-onboarding" hidden>
        <h1 data-i18n="onb_title"></h1>
        <p class="muted" id="onb-lead" data-i18n="onb_lead"></p>
        <p class="invite-note" id="invite-note" hidden></p>
        <form id="form-onboarding" class="form">
          <fieldset class="acct">
            <legend data-i18n="acct_type"></legend>
            <label class="acct-opt"><input type="radio" name="accountType" value="member" checked>
              <span><strong data-i18n="acct_member"></strong><small data-i18n="acct_member_d"></small></span></label>
            <label class="acct-opt"><input type="radio" name="accountType" value="general">
              <span><strong data-i18n="acct_general"></strong><small data-i18n="acct_general_d"></small></span></label>
          </fieldset>
          <label><span data-i18n="f_phone"></span><input name="whatsapp" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="08…"><small class="muted" id="phone-hint" data-i18n="f_phone_hint"></small></label>
          <label><span data-i18n="f_name"></span><input name="displayName" required maxlength="80" autocomplete="name"></label>
          <label><span data-i18n="f_city"></span><input name="city" required maxlength="60" autocomplete="address-level2"></label>
          <label><span data-i18n="f_instagram"></span><input name="instagram" required maxlength="40" placeholder="@username"></label>
          <label><span data-i18n="f_bio"></span><textarea name="bio" rows="3" maxlength="400"></textarea></label>
          <button class="btn btn-mat" type="submit" data-i18n="send_request"></button>
        </form>
      </div>
      <div class="panel" id="gate-pending" hidden>
        <div class="pending-mark" aria-hidden="true"></div>
        <h1 data-i18n="pending_title"></h1>
        <p class="muted" data-i18n="pending_lead"></p>
      </div>
      <div class="panel" id="gate-rejected" hidden>
        <h1 data-i18n="rejected_title"></h1>
        <p class="muted" data-i18n="rejected_lead"></p>
      </div>
    </section>

    <!-- ===== Members area ===== -->
    <section id="app" hidden>
      <nav class="tabs" aria-label="Member sections">
        <a href="#/collection" data-tab="collection" data-i18n="tab_collection">Koleksi</a>
        <a href="#/events" data-tab="events" data-i18n="tab_events">Acara</a>
        <a href="#/members" data-tab="members" data-i18n="tab_members">Anggota</a>
        <a href="#/dues" data-tab="dues" data-i18n="tab_dues">Iuran</a>
        <a href="#/card" data-tab="card" data-i18n="tab_card" id="tab-card">Kartu saya</a>
        <a href="#/finance" data-tab="finance" data-i18n="tab_finance" id="tab-finance" hidden>Keuangan</a>
        <a href="#/admin" data-tab="admin" data-i18n="tab_admin" id="tab-admin" hidden>Admin</a>
      </nav>

      <div class="view" id="view-collection" hidden>
        <div class="view-head">
          <div class="seg" role="group">
            <button type="button" data-filter="all" aria-pressed="true" data-i18n="all"></button>
            <button type="button" data-filter="mine" aria-pressed="false" data-i18n="mine"></button>
          </div>
          <button type="button" class="btn btn-mat" id="btn-add-car" data-i18n="add_car"></button>
        </div>
        <div class="grid" id="cars"></div>
      </div>

      <div class="view" id="view-events" hidden>
        <div class="view-head">
          <h2 data-i18n="upcoming"></h2>
          <button type="button" class="btn btn-mat" id="btn-add-event" data-i18n="add_event" hidden></button>
        </div>
        <div class="events" id="events-upcoming"></div>
        <details class="past">
          <summary data-i18n="past"></summary>
          <div class="events" id="events-past"></div>
        </details>
      </div>

      <div class="view" id="view-members" hidden>
        <div id="members-list">
          <div class="view-head mem-sync-bar" id="mem-sync-bar" hidden>
            <button type="button" class="btn btn-mat" id="mem-sync" data-i18n="mem_sync"></button>
            <button type="button" class="btn-link" id="mem-sync-link" data-i18n="sheet_change_link"></button>
          </div>
          <div class="view-head">
            <p class="muted" data-i18n="members_lead"></p>
            <input type="search" id="member-search" class="search" data-i18n-ph="search_members" aria-label="Search members">
          </div>
          <div class="roster" id="roster"></div>
        </div>
        <div id="member-profile" hidden></div>
      </div>

      <div class="view" id="view-dues" hidden>
        <div class="view-head" id="dues-mode-bar" hidden>
          <div class="seg" role="group">
            <button type="button" data-dmode="mine" aria-pressed="true" data-i18n="dues_my"></button>
            <button type="button" data-dmode="all" aria-pressed="false" data-i18n="dues_all"></button>
          </div>
        </div>
        <div id="dues-mine"></div>
        <div id="dues-all" hidden></div>
      </div>

      <div class="view" id="view-card" hidden>
        <div class="card-wrap" id="member-card"></div>
        <form id="form-profile" class="form panel-flat">
          <h2 data-i18n="edit_profile"></h2>
          <label><span data-i18n="f_name"></span><input name="displayName" required maxlength="80"></label>
          <label><span data-i18n="f_city"></span><input name="city" required maxlength="60"></label>
          <label><span data-i18n="f_instagram"></span><input name="instagram" maxlength="40"></label>
          <label><span data-i18n="f_whatsapp"></span><input name="whatsapp" maxlength="20" inputmode="tel"></label>
          <label><span data-i18n="f_bio"></span><textarea name="bio" rows="3" maxlength="400"></textarea></label>
          <button class="btn btn-mat" type="submit" data-i18n="save"></button>
        </form>
      </div>

      <div class="view" id="view-finance" hidden>
        <div class="view-head fin-head">
          <h2 data-i18n="fin_title"></h2>
          <div class="fin-actions">
            <select id="fin-period" class="search" aria-label="Periode"></select>
            <button type="button" class="btn btn-mat" id="fin-sync" data-i18n="fin_sync"></button>
            <button type="button" class="btn-link" id="fin-sync-link" data-i18n="sheet_change_link" hidden></button>
            <label class="btn btn-ghost fin-import"><span data-i18n="fin_import"></span><input type="file" id="fin-file" accept=".csv,text/csv" hidden></label>
            <button type="button" class="btn btn-ghost" id="fin-print" data-i18n="fin_print"></button>
          </div>
        </div>
        <p class="muted fin-note"><span data-i18n="fin_only_admin"></span> <span id="fin-source"></span></p>
        <div id="fin-body"></div>
      </div>

      <div class="view" id="view-admin" hidden>
        <h2 data-i18n="pending_requests"></h2>
        <div class="rows" id="admin-pending"></div>
        <h2 data-i18n="members"></h2>
        <div class="rows" id="admin-members"></div>
        <div id="admin-import"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <img class="logo" src="/img/logo-white.png" alt="RCMI — Resin Car Model Indonesia" width="900" height="343" loading="lazy">
  </footer>

  <dialog id="lightbox" aria-label="Gallery">
    <div class="lb-stage" id="lb-stage"></div>
    <div class="lb-bar">
      <button type="button" class="btn btn-sm btn-ghost-light" id="lb-prev" data-i18n="prev"></button>
      <span id="lb-count"></span>
      <a class="lb-drive" id="lb-drive" target="_blank" rel="noopener" data-i18n="open_drive"></a>
      <button type="button" class="btn btn-sm btn-ghost-light" id="lb-next" data-i18n="next"></button>
      <button type="button" class="btn btn-sm btn-amber" id="lb-close" data-i18n="close"></button>
    </div>
  </dialog>

  <dialog id="modal">
    <div id="modal-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js?v=1792599814"></script>
</body>
</html>
